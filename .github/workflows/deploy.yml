
name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BASE_PATH: /jyo.codes
      NEXT_PUBLIC_SITE_URL: https://jyoti0902.github.io/jyo.codes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      
      - name: Build static site
        run: npm run build

      - name: Verify static export
        run: |
          if [ ! -d "out" ]; then
            echo "Error: 'out' directory was not generated."
            exit 1
          fi
          test -f out/index.html || { echo "Error: out/index.html is missing"; exit 1; }
          test -f out/robots.txt || { echo "Error: out/robots.txt is missing"; exit 1; }
          test -f out/sitemap.xml || { echo "Error: out/sitemap.xml is missing"; exit 1; }
          echo "Static export verified successfully."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
